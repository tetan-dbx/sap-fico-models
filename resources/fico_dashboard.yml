resources:
  dashboards:
    fico_cockpit:
      display_name: "[${bundle.target}] ${var.customer_name} — Financial Cockpit"
      file_path: ../src/dashboard/fico_cockpit.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${workspace.root_path}
      # Dataset queries reference the semantic_* metric views unqualified; these set
      # the default catalog/schema for every dataset so the JSON stays portable.
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
